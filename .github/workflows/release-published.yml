name: Publish manually created release
on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.release.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run publish.yml --ref main -f tag="$TAG"
