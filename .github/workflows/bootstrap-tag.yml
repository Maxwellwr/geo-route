name: Bootstrap release tag
on:
  push:
    branches:
      - feature/import-existing-dnsmasq-ipsets

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create v0.1.6 baseline tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.6 >/dev/null 2>&1; then
            echo "v0.1.6 already exists"
            exit 0
          fi
          git tag v0.1.6
          git push origin refs/tags/v0.1.6
