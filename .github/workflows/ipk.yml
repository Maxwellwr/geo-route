name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/geo-ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dnsmasq importer
        run: python -m unittest discover -s scripts/geo/tests -v
      - name: Build test ipk
        env:
          GEO_ROUTE_VERSION: 0.0.0
        run: |
          chmod +x package/geo-route/build-ipk.sh
          npm ci --prefix scripts/geo-ui/frontend
          ./package/geo-route/build-ipk.sh
