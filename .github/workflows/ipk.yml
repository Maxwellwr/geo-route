name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz actionlint
          ./actionlint -color

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/geo-ui/frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test dnsmasq importer
        run: python -m unittest discover -s scripts/geo/tests -v

      - name: Build test ipk
        env:
          GEO_ROUTE_VERSION: 0.0.0
        run: |
          chmod +x package/geo-route/build-ipk.sh
          npm ci --prefix scripts/geo-ui/frontend
          ./package/geo-route/build-ipk.sh
