# Точка входа geo-маршрутизации. Формат:
#   include <path|glob>  — относительные пути от каталога текущего файла
#   [ipset]              — секция = базовый ipset (мержится между файлами)
#   geosite:<тег>        — домены из geosite.dat -> dnsmasq ipset=/d/<ipset>-site
#   geoip:<тег>          — CIDR из geoip.dat -> ipset <ipset>-ip
#   <домен>              — как geosite, но домен вручную
# `#` — комментарий (в т.ч. инлайн). Обновление: geo-update.sh (cron.weekly).

include geo.d/*.conf
